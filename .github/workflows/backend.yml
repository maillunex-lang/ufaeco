name: backend
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: basheco
          POSTGRES_PASSWORD: basheco_dev_only
          POSTGRES_DB: basheco_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U basheco" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
