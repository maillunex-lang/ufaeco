# Только для локальной разработки и тестов. Не для VPS и не для production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: basheco
      POSTGRES_PASSWORD: basheco_dev_only
      POSTGRES_DB: basheco_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - basheco_pgdata:/var/lib/postgresql/data
      - ./server/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basheco -d basheco_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  basheco_pgdata:
